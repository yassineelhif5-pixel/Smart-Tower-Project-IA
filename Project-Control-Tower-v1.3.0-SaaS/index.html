<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Project Control Tower : pilotage et sécurisation des projets pour ESN (démo).">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif;background:#F1F3F6}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Project Control Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: console rail (dark, like a tower desk) + scrolling workspace. Every page = question → summary band → detail grid. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --sunken:#E8ECF1;
  --ink:#111827; --ink-2:#2A3343; --muted:#5B6576; --faint:#8C95A5; --line:#E0E4EB; --line-2:#CCD2DC;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#DCEFED;
  --ok:#1D8A57; --ok-soft:#E0F2E9; --warn:#B87304; --warn-soft:#FBEFD8; --crit:#C8372C; --crit-soft:#FAE3E0; --info:#2D6CCB; --info-soft:#E2EBFA;
  --rail:#0E1420; --rail-2:#182133; --rail-ink:#D3DAE6; --rail-muted:#7D879A; --rail-line:#212B3D;
  --av1:#0B7A75; --av2:#3D5BA9; --av3:#9A4E8E; --av4:#B5651D; --av5:#4C7A2E; --av6:#6B5CA5;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
  --shadow-lg:0 20px 60px rgba(10,15,25,.22);
  --f-display:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E15; --surface:#111722; --surface-2:#151C28; --sunken:#0C1119;
  --ink:#E8EDF5; --ink-2:#C6CEDB; --muted:#8F99AC; --faint:#626E83; --line:#202938; --line-2:#2B3648;
  --accent:#35B6AD; --accent-ink:#04201E; --accent-soft:#11302E;
  --ok:#41C487; --ok-soft:#0F2A1E; --warn:#E8A93F; --warn-soft:#2F2411; --crit:#F26B5F; --crit-soft:#35171A; --info:#73A6F3; --info-soft:#14233B;
  --rail:#06090E; --rail-2:#121A28; --rail-ink:#D3DAE6; --rail-muted:#6F798C; --rail-line:#1A2232;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 20px 60px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E15; --surface:#111722; --surface-2:#151C28; --sunken:#0C1119;
  --ink:#E8EDF5; --ink-2:#C6CEDB; --muted:#8F99AC; --faint:#626E83; --line:#202938; --line-2:#2B3648;
  --accent:#35B6AD; --accent-ink:#04201E; --accent-soft:#11302E;
  --ok:#41C487; --ok-soft:#0F2A1E; --warn:#E8A93F; --warn-soft:#2F2411; --crit:#F26B5F; --crit-soft:#35171A; --info:#73A6F3; --info-soft:#14233B;
  --rail:#06090E; --rail-2:#121A28; --rail-ink:#D3DAE6; --rail-muted:#6F798C; --rail-line:#1A2232;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 20px 60px rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{flex:none;display:block}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rail-line)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand b{font:600 16px/1.1 var(--f-display);letter-spacing:-.01em;color:#fff}
.brand small{display:block;font:500 10.5px/1.2 var(--f-mono);color:var(--rail-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.tenant{margin:0 12px 10px;padding:9px 11px;border:1px solid var(--rail-line);border-radius:10px;background:var(--rail-2);display:flex;align-items:center;gap:9px;font-size:12.5px}
.tenant .dot{width:8px;height:8px;border-radius:50%;background:#3CC283;box-shadow:0 0 0 3px rgba(60,194,131,.18)}
.tenant small{display:block;color:var(--rail-muted);font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.nav{flex:1;overflow:auto;padding:4px 10px 12px}
.nav h6{margin:14px 10px 6px;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--rail-muted)}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--rail-ink);text-decoration:none;font-size:13.5px;position:relative;transition:background .15s}
.nav a:hover{background:var(--rail-2)}
.nav a.on{background:var(--rail-2);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#35B6AD}
.nav a .ic{opacity:.75} .nav a.on .ic{opacity:1;color:#5FD3C9}
.nav a .count{margin-left:auto;font:500 11px var(--f-mono);background:#C8372C;color:#fff;border-radius:20px;padding:0 7px;line-height:18px}
.rail-foot{padding:12px 16px 16px;border-top:1px solid var(--rail-line);font-size:11.5px;color:var(--rail-muted);display:flex;flex-direction:column;gap:4px}
.rail-foot .api{font-family:var(--f-mono);font-size:10.5px}
.rail-foot .api i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3CC283;margin-right:6px;vertical-align:1px}

.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.burger{display:none;border:0;background:none;padding:6px;border-radius:8px}
.search-btn{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--muted);text-align:left;min-width:0}
.search-btn span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-btn kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{position:relative;border:1px solid transparent;background:none;padding:8px;border-radius:9px;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface);border-color:var(--line)}
.icon-btn .badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:9px;background:var(--crit);color:#fff;font:600 10px/16px var(--f-mono);text-align:center;padding:0 4px}
.who{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 10px 5px 5px;text-align:left}
.who b{display:block;font-size:13px;line-height:1.2}
.who small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.main{flex:1;overflow:auto;padding:26px 28px 60px}
.page{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ---------- type ---------- */
.eyebrow{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{margin:4px 0 0;font:600 30px/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--muted);max-width:68ch}
h2.sec{margin:0;font:600 17px/1.2 var(--f-display);letter-spacing:-.01em}
h3{margin:0;font:600 14px/1.3 var(--f-body)}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:500;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card-h small{color:var(--muted)}
.card-b{padding:14px 16px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--sunken);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.nodot::before{display:none}
.t-ok{color:var(--ok)} .t-warn{color:var(--warn)} .t-crit{color:var(--crit)} .t-info{color:var(--info)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.tag{font:500 11px var(--f-mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:5px;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:600 11px var(--f-body);flex:none;letter-spacing:.02em}
.av.lg{width:64px;height:64px;font-size:22px}
.av.sm{width:22px;height:22px;font-size:9.5px}
.avs{display:flex}.avs .av{border:2px solid var(--surface);margin-left:-6px}.avs .av:first-child{margin-left:0}
.bar{height:6px;border-radius:6px;background:var(--sunken);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.crit i{background:var(--crit)}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:3px;background:var(--ok)}
.dots i.warn{background:var(--warn)} .dots i.crit{background:var(--crit)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.lnk{color:var(--accent);background:none;border:0;padding:0;font-weight:500;text-decoration:none}
.lnk:hover{text-decoration:underline}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* KPI band */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi label{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi strong{font:600 26px/1.15 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.kpi.warn strong{color:var(--warn)} .kpi.crit strong{color:var(--crit)} .kpi.ok strong{color:var(--ok)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl.tight th,.tbl.tight td{padding:7px 8px;white-space:nowrap}
.tbl.tight .inp{padding:6px 8px;font-size:13px}
.tbl.tight input[type=date]{width:138px}
.cell-main b{display:block;font-weight:600}
.cell-main small{color:var(--muted)}

/* ---------- health strip ---------- */
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;padding:20px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.verdict::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--tone,var(--ok))}
.verdict h2{margin:6px 0 4px;font:600 26px/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.verdict .say{font-size:15.5px;color:var(--ink-2);max-width:72ch;margin:6px 0 0}
.verdict .say b{color:var(--ink)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:12.5px;margin-top:10px;align-items:center}
.meta-row span{display:inline-flex;align-items:center;gap:6px}
.big-state{text-align:right}
.big-state .pill{font-size:13px;padding:5px 12px}
.health{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.hcell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 11px;text-align:left;position:relative;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.hcell:hover{transform:translateY(-1px);border-color:var(--line-2)}
.hcell::before{content:"";position:absolute;left:12px;right:12px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--tone)}
.hcell label{display:flex;justify-content:space-between;align-items:center;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hcell label i{width:9px;height:9px;border-radius:50%;background:var(--tone);box-shadow:0 0 0 3px color-mix(in srgb,var(--tone) 20%,transparent)}
.hcell strong{display:block;margin-top:8px;font:600 17px/1.2 var(--f-display);color:var(--ink)}
.hcell small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.35}

/* forecast */
.fc-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.fc-row div{min-width:0}
.fc-row label{display:block;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fc-row b{font:600 19px/1.3 var(--f-display);font-variant-numeric:tabular-nums}
.stack{position:relative;height:30px;border-radius:7px;background:var(--sunken);overflow:visible;display:flex}
.stack .s-act{background:var(--accent);border-radius:7px 0 0 7px}
.stack .s-raf{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 45%,transparent) 0 6px,color-mix(in srgb,var(--accent) 25%,transparent) 6px 12px)}
.stack .s-over{background:repeating-linear-gradient(135deg,var(--crit) 0 6px,color-mix(in srgb,var(--crit) 60%,transparent) 6px 12px);border-radius:0 7px 7px 0}
.stack .s-mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.stack .s-mark span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:500 10.5px var(--f-mono);white-space:nowrap;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--crit-soft);color:var(--ink);margin-top:14px}
.callout.warn{background:var(--warn-soft)} .callout.ok{background:var(--ok-soft)} .callout.info{background:var(--info-soft)}
.callout b{font:600 13px var(--f-mono);letter-spacing:.04em}
.callout .t-crit,.callout .t-warn{flex:none;margin-top:2px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font:500 10.5px var(--f-mono)}
svg.chart .grid line{stroke:var(--line)}

/* drift causes */
.cause{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 10px;border-radius:9px;border:1px solid transparent;width:100%;background:none;text-align:left;align-items:center}
.cause:hover{background:var(--surface-2);border-color:var(--line)}
.cause.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.cause b{font-weight:600;font-size:13px}
.cause .amt{font:600 13px var(--f-mono);color:var(--crit);text-align:right}
.cause small{grid-column:1/-1;color:var(--muted);font-size:12px}
.cat{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.cat .bar{height:8px}
.cat span:last-child{text-align:right;font-family:var(--f-mono);color:var(--crit)}

/* alerts */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .sev{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.alert .sev.crit{background:var(--crit-soft);color:var(--crit)} .alert .sev.warn{background:var(--warn-soft);color:var(--warn)} .alert .sev.info{background:var(--info-soft);color:var(--info)}
.alert b{display:block;font-weight:600;font-size:13.5px}
.alert small{display:block;color:var(--muted);font-size:12px}
.rule-id{font:500 10.5px var(--f-mono);color:var(--faint)}

/* gantt */
.gantt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gantt{position:relative;min-width:780px;--lw:230px}
.g-head,.g-row{display:grid;grid-template-columns:var(--lw) minmax(0,1fr)}
.g-head{position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--line);height:34px}
.g-head .g-label{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 14px}
.g-head .g-track span{position:absolute;top:0;bottom:0;padding:9px 6px;font:500 11px var(--f-mono);color:var(--muted);border-left:1px solid var(--line);white-space:nowrap;overflow:hidden;text-transform:capitalize}
.g-track{position:relative;min-height:44px}
.g-row{border-bottom:1px solid var(--line)}
.g-row:last-of-type{border-bottom:0}
.g-row .g-label{padding:7px 14px;min-width:0;border-right:1px solid var(--line)}
.g-row .g-label b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row .g-label small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row.g-group{background:var(--surface-2)}
.g-bar{position:absolute;top:13px;height:18px;border-radius:5px;background:color-mix(in srgb,var(--tone) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--tone) 55%,transparent);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--tone);opacity:.85}
.g-bar em{position:absolute;inset:0;font:500 10px/16px var(--f-mono);font-style:normal;color:var(--ink);padding-left:6px;white-space:nowrap}
.g-slip{position:absolute;top:13px;height:18px;border-radius:0 5px 5px 0;background:repeating-linear-gradient(135deg,var(--warn) 0 4px,transparent 4px 8px);opacity:.75}
.g-ms{position:absolute;top:14px;width:15px;height:15px;transform:translateX(-50%) rotate(45deg);background:var(--tone);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--tone)}
.g-today{position:absolute;top:0;bottom:0;width:0;left:calc(var(--lw) + (100% - var(--lw)) * var(--xf));border-left:2px solid var(--crit);pointer-events:none}
.g-today span{position:absolute;top:8px;left:4px;font:600 10px var(--f-mono);color:var(--crit);background:var(--surface);padding:0 3px;border-radius:3px}
.tone-ok{--tone:var(--ok)} .tone-warn{--tone:var(--warn)} .tone-crit{--tone:var(--crit)} .tone-info{--tone:var(--info)} .tone-acc{--tone:var(--accent)} .tone-mute{--tone:var(--faint)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunken);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;font-weight:600;font-size:12.5px}
.col-h span{font:500 11px var(--f-mono);color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:var(--shadow);text-align:left;width:100%}
.kcard:hover{border-color:var(--line-2)}
.kcard.dragging{opacity:.45}
.kcard .k-top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.kcard b{font-weight:600;font-size:13px;line-height:1.35}
.kcard .k-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted)}
.kcard .blk{font-size:11.5px;color:var(--crit);background:var(--crit-soft);padding:4px 7px;border-radius:6px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;font-size:13.5px}
.chk input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.chk.done span{color:var(--faint);text-decoration:line-through}

/* load bars */
.load{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) 92px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.load:last-child{border-bottom:0}
.load .who2{display:flex;gap:9px;align-items:center;min-width:0}
.load .who2 b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load .who2 small{display:block;font-size:11.5px;color:var(--muted)}
.lbar{position:relative;height:12px;background:var(--sunken);border-radius:6px}
.lbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ok)}
.lbar i.warn{background:var(--warn)} .lbar i.crit{background:var(--crit)}
.lbar s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.load .v{font:500 12.5px var(--f-mono);text-align:right}
.heat{display:grid;gap:3px}
.heat i{height:26px;border-radius:5px;display:grid;place-items:center;font:500 11px var(--f-mono);font-style:normal}

/* risk matrix */
.matrix{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:4px;font:500 10.5px var(--f-mono);color:var(--muted)}
.matrix .mc{aspect-ratio:1.5;border-radius:6px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;padding:3px;max-width:100%}
.matrix .mc button{border:0;font:600 10px var(--f-mono);border-radius:4px;padding:2px 4px;background:var(--surface);color:var(--ink)}
.matrix .ax{display:grid;place-items:center}

/* V cycle */
.vwrap svg text{font:500 10.5px var(--f-body);fill:var(--ink-2)}

/* modal / drawer / toast / cmdk */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;animation:fade .15s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:84vh;display:flex;flex-direction:column;animation:pop .18s}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font:600 17px var(--f-display)}
.modal-b{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.drawer-scrim{position:fixed;inset:0;background:rgba(8,12,20,.35);z-index:50;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:51;display:flex;flex-direction:column;animation:slide .2s;padding-top:env(safe-area-inset-top,0px)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px}
.inp:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent)}
textarea.inp{min-height:70px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:18px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 36px))}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 14px;box-shadow:var(--shadow-lg);font-size:13px;animation:pop .2s}
.toast pre{margin:8px 0 0;font:11px/1.45 var(--f-mono);white-space:pre-wrap;opacity:.85}
.toast.err{background:var(--crit);color:#fff}
.cmdk{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{flex:1;border:0;background:none;font-size:16px;outline:none}
.cmdk-res{max-height:55vh;overflow:auto;padding:6px}
.cmdk-res h6{margin:10px 10px 4px;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cmdk-res button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left}
.cmdk-res button:hover,.cmdk-res button.sel{background:var(--accent-soft)}
.cmdk-res button small{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);width:300px;padding:6px;z-index:40;animation:pop .15s}
.menu-pop h6{margin:8px 10px 6px;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.menu-pop button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 9px;border-radius:8px;text-align:left}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop button.on{background:var(--accent-soft)}
.menu-pop button b{display:block;font-size:13px;font-weight:600}
.menu-pop button small{display:block;font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:500;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.stepper{display:flex;gap:0;flex-wrap:wrap}
.stepper span{font:500 11px var(--f-mono);padding:5px 10px;background:var(--sunken);color:var(--muted);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%);margin-right:-4px}
.stepper span:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%)}
.stepper span.done{background:var(--accent-soft);color:var(--accent)} .stepper span.cur{background:var(--accent);color:var(--accent-ink)}
.switch{position:relative;width:34px;height:20px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:20px;background:var(--line-2);transition:.15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+i{background:var(--accent)} .switch input:checked+i::after{left:17px}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.perm{display:grid;place-items:center}
.perm input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.drop-zone{border:1.5px dashed var(--line-2);border-radius:12px;padding:22px;text-align:center;color:var(--muted);background:var(--surface-2);transition:.15s}
.drop-zone.over{border-color:var(--accent);background:var(--accent-soft)}
.ext{font:600 10px var(--f-mono);width:38px;height:44px;border-radius:6px;display:grid;place-items:end center;padding-bottom:6px;color:#fff;flex:none;position:relative}
.ext::before{content:"";position:absolute;top:0;right:0;width:11px;height:11px;background:rgba(255,255,255,.35);border-bottom-left-radius:4px}
.client-logo{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font:700 14px var(--f-display);color:#fff;flex:none;letter-spacing:.02em}
.ccard{display:flex;flex-direction:column;gap:14px;padding:18px;cursor:pointer;transition:transform .15s,border-color .15s;text-align:left;width:100%}
.ccard:hover{transform:translateY(-2px);border-color:var(--line-2)}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunken) 0);display:grid;place-items:center;flex:none}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 13px var(--f-mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:9px 12px}
.lc-row{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px}
.lc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lc-head .btn{margin-left:auto}
.lc-wrap{overflow-x:auto;padding:2px 0 4px}
.lc{display:grid;grid-template-columns:repeat(var(--n),minmax(84px,1fr));min-width:calc(var(--n) * 88px)}
.lc-s{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:11.5px;line-height:1.25;color:var(--muted);padding:0 4px}
.lc-s::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:2px;background:var(--line-2)}
.lc-s:first-child::before{display:none}
.lc-s.done::before,.lc-s.cur::before{background:var(--accent)}
.lc-s.hold::before{background:var(--warn)}
.lc-s i{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);display:grid;place-items:center;color:#fff}
.lc-s.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lc-s.cur i{border-color:var(--ok);background:var(--ok);box-shadow:0 0 0 5px var(--ok-soft)}
.lc-s.cur i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--surface)}
.lc-s.cur.hold i{border-color:var(--warn);background:var(--surface);box-shadow:0 0 0 5px var(--warn-soft);color:var(--warn)}
.lc-s.cur.hold,.lc-s.cur.hold em{color:var(--warn)}
.lc-s.cur.hold i::after{display:none}
.lc-s.cur{color:var(--ok);font-weight:600}
.lc-s.cur::before{background:linear-gradient(90deg,var(--accent),var(--ok))}
.lc-s em{font-style:normal;font:500 10.5px var(--f-mono);color:var(--muted)}
.lc-s.cur em{color:var(--ok)}
.tag.cur{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.chipbtn.cur:not(.on){border-color:var(--ok);color:var(--ok)}
.lc-bar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin:4px 0 12px}
.lc-bar i{background:var(--tone);min-width:4px}
.sb{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sb-col{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:5px;min-height:100px;min-width:0}
.sb-n{font:600 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.sb-col.empty .sb-n{color:var(--faint)}
.sb-col label{font:500 10.5px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
button.tag{cursor:pointer}
.tag.hold{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.cal{width:44px;flex:none;border:1px solid var(--line);border-radius:9px;text-align:center;padding:4px 0;background:var(--surface-2)}
.cal b{display:block;font:600 17px/1.1 var(--f-display);white-space:normal!important}
.cal small{display:block;font:500 10px var(--f-mono)!important;text-transform:uppercase;color:var(--muted)}
.kd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.kd{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);min-width:0;transition:border-color .15s,transform .15s}
.kd:hover{border-color:var(--line-2);transform:translateY(-1px)}

.kd .phrase{display:block;font-weight:600;font-size:13.5px;line-height:1.3;color:var(--ink)}
.kd small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.kdl .li.past b{color:var(--faint);text-decoration:line-through}
.us-list{display:flex;flex-direction:column;gap:10px}
.us{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.us-h{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.us-pts{width:36px;height:36px;border-radius:10px;background:var(--info-soft);color:var(--info);display:grid;place-items:center;font:600 14px var(--f-mono);flex:none}
.us-pts.sm{width:30px;height:30px;font-size:12.5px;border-radius:8px}
.us.closed .us-pts{background:var(--ok-soft);color:var(--ok)}
.us-h b{display:block;font-size:14px;margin-top:4px;line-height:1.35}
.us-h small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.us-prog{width:116px;flex:none;font:500 11.5px var(--f-mono);color:var(--muted);text-align:right}
.us-prog .bar{margin-top:6px}
.us-tasks{border-top:1px solid var(--line);background:var(--surface-2);padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.us-t{display:flex;align-items:center;gap:9px;border:0;background:none;padding:6px 6px;border-radius:7px;text-align:left;width:100%;font-size:13px;color:var(--ink)}
.us-t:hover{background:var(--surface)}
.us-t .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:640px){.us-prog{width:70px}.us-t .mono.raf,.us-t .pill{display:none}}
.thread{display:flex;flex-direction:column;gap:12px;max-height:440px;overflow:auto;padding:4px 2px 2px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:90%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg .body{min-width:0;display:flex;flex-direction:column}
.msg.mine .body{align-items:flex-end}
.msg .meta{font-size:11.5px;color:var(--muted);margin:0 4px 3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere;color:var(--ink)}

.mention{color:var(--accent);font-weight:600}
.day-sep{align-self:center;font:500 10.5px var(--f-mono);color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:2px 10px;border-radius:20px;background:var(--sunken)}
.composer{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.composer .row{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:42px;max-height:160px;resize:vertical;flex:1}
.composer .opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.cbadge{float:right;margin-left:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:1px 7px;font:500 11px var(--f-mono);color:var(--faint);display:inline-flex;gap:4px;align-items:center}
.cbadge:hover{border-color:var(--accent);color:var(--accent)}
.cbadge.has{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft)}
.ai-panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:45;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:slide .2s}
.ai-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}

.ai-orb{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,var(--accent),var(--info))}

.ai-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ai-msg{max-width:92%;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}

/* ================= health engine ================= */
function tone(v,[a,b]){return v<=a?'ok':v<=b?'warn':'crit'}
function health(p){
  const T=state.T, bud=budgetOf(p), fc=fcOf(p), over=(fc-bud)/bud*100, cons=p.consumed/bud*100;
  let delay=Math.max(0,diff(p.end,p.fend)); if(TODAY>D(p.end)&&p.progress<100) delay=Math.max(delay,diff(p.end,TODAY));
  const acts=ACTIONS.filter(a=>a.p===p.id), blocked=acts.filter(a=>a.status==='blocked').length, late=acts.filter(a=>a.status!=='blocked'&&lateDays(a)>0).length;
  const risks=RISKS.filter(r=>r.p===p.id&&r.status!=='Clos'), crits=risks.filter(r=>crit(r)>=15).length;
  const t=p.tests, rate=t.pass+t.fail?t.pass/(t.pass+t.fail)*100:null;
  const hDrift=p.hDone+p.hRaf-p.hBase;
  const bt=over>T.overrun?'crit':over>0?'warn':cons<T.budget[0]?'ok':cons<=T.budget[1]?'warn':'crit';
  const dims=[
   {k:'planning',label:'Planning',tone:tone(delay,T.delay),val:delay>0?`+${delay} jours`:'Dans les délais',sub:delay>0?`Fin prévisionnelle ${ddy(p.fend)}`:`Fin prévue ${ddy(p.end)}`},
   {k:'budget',label:'Budget',tone:bt,val:over>0?`Forecast +${keur(fc-bud)}`:`${pc(cons)} consommé`,sub:over>0?`${sgn(+over.toFixed(2))} % vs budget révisé`:`Forecast ${keur(fc)} / ${keur(bud)}`,money:true},
   {k:'charge',label:'Charge',tone:p.teamLoad<T.load[0]?'ok':p.teamLoad<=T.load[1]?'warn':'crit',val:hDrift>0?`+${hDrift} h`:'Stable',sub:`Équipe chargée à ${p.teamLoad} %`,money:true},
   {k:'quality',label:'Qualité',tone:rate===null?'ok':rate>=T.quality[0]?'ok':rate>=T.quality[1]?'warn':'crit',val:rate===null?'Recette à venir':`${pc(rate)} réussite`,sub:rate===null?'Aucune campagne lancée':`${t.crit} anomalie${t.crit>1?'s':''} critique${t.crit>1?'s':''}`},
   {k:'risks',label:'Risques',tone:tone(crits,T.crit),val:`${risks.length} risque${risks.length>1?'s':''}`,sub:`${crits} critique${crits>1?'s':''}`},
   {k:'blocks',label:'Blocages',tone:tone(blocked+late,T.late),val:`${blocked} bloquée${blocked>1?'s':''}`,sub:`${late} action${late>1?'s':''} en retard`},
  ];
  const reds=dims.filter(d=>d.tone==='crit').length, oranges=dims.filter(d=>d.tone==='warn').length;
  const pb=dims.slice(0,2);
  const overall=(reds>=2||pb.some(d=>d.tone==='crit'))?'crit':(reds>=1||oranges>=2||pb.some(d=>d.tone==='warn'))?'warn':'ok';
  return {dims,overall,delay,over,fc,bud,cons,blocked,late,crits,rate,hDrift};
}
const VERDICT={ok:'Maîtrisé',warn:'Sous surveillance',crit:'Critique'};
const toneVar=t=>({ok:'var(--ok)',warn:'var(--warn)',crit:'var(--crit)'}[t]);
function alertsFor(p){
  const h=health(p),out=[],on=id=>RULES.find(r=>r.id===id).on;
  if(on('R-BUD-01')&&h.over>0) out.push({rule:'R-BUD-01',sev:'crit',title:`Dépassement budgétaire prévisionnel ${sgn(h.fc-h.bud)} €`,detail:`Forecast ${eur(h.fc)} pour un budget révisé de ${eur(h.bud)} · écart ${sgn(+h.over.toFixed(2))} %`,kind:'budget',money:true});
  else if(on('R-BUD-02')&&h.cons>state.T.budget[0]) out.push({rule:'R-BUD-02',sev:'warn',title:`Budget consommé à ${pc(h.cons)}`,detail:`Seuil d'alerte organisation : ${state.T.budget[0]} %`,kind:'budget',money:true});
  ACTIONS.filter(a=>a.p===p.id).forEach(a=>{
    const l=lateDays(a),s=slipDays(a);
    if(on('R-PLN-01')&&l>0) out.push({rule:'R-PLN-01',sev:'crit',title:`Retard confirmé +${l} j · ${a.id}`,detail:`${a.title} — prévue le ${dd(a.due)}, ${STL[a.status].toLowerCase()}`,kind:'planning',act:a.id});
    else if(on('R-PLN-02')&&s>0) out.push({rule:'R-PLN-02',sev:'warn',title:`Risque de retard estimé +${s} j · ${a.id}`,detail:`${a.title} — prévue ${dd(a.due)}, prévisionnelle ${dd(a.fdue)}`,kind:'planning',act:a.id});
  });
  if(on('R-RES-01')) p.team.forEach(id=>{const u=PEOPLE[id];if(u.cap&&u.load[0]>u.cap) out.push({rule:'R-RES-01',sev:'warn',title:`Surcharge ressource · ${u.name}`,detail:`Capacité ${u.cap} h · charge ${u.load[0]} h · surcharge +${u.load[0]-u.cap} h cette semaine`,kind:'resource'})});
  if(on('R-DOC-01')){const miss=docGaps(p);if(miss.length)out.push({rule:'R-DOC-01',sev:'warn',title:`${miss.length} livrable${miss.length>1?'s':''} non validé${miss.length>1?'s':''} pour l'étape en cours`,detail:miss.map(r=>r.t.short+(r.d?' ('+r.d.dstat.toLowerCase()+')':' (manquant)')).join(' · '),kind:'planning'})}
  const stl=stateOf(p);if(on('R-LC-01')&&stl.hold){const n=diff(stl.since,TODAY);if(n>10){const x=stl.entry.extra||{};out.push({rule:'R-LC-01',sev:n>20?'crit':'warn',title:`${stl.cur.label} depuis ${n} jours`,detail:`Attendu de ${x.waitingOn||'—'} : ${x.info||'—'}${x.relance&&D(x.relance)<TODAY?' · relance dépassée':''}`,kind:'planning'})}}
  if(on('R-RSK-01')) RISKS.filter(r=>r.p===p.id&&crit(r)>=15).forEach(r=>out.push({rule:'R-RSK-01',sev:'crit',title:`Risque critique · ${r.id}`,detail:`${r.title} (P${r.prob} × I${r.imp} = ${crit(r)})`,kind:'risk'}));
  const order={crit:0,warn:1,info:2};return out.sort((a,b)=>order[a.sev]-order[b.sev]);
}

function forecastChart(p){
  const W=600,H=230,pl=46,pr=14,pt=16,pb=30;
  const months=p.months,n=months.length,bud=budgetOf(p)/1000,fc=fcOf(p)/1000;
  const elapsed=months.filter(m=>D(m+'-01')<=TODAY).length;
  const actual=p.series||(elapsed<1?[0]:null)||Array.from({length:elapsed},(_,i)=>Math.round(p.consumed/1000*Math.pow((i+1)/elapsed,1.1)));
  const lastA=actual[actual.length-1];
  const fcs=[];for(let i=actual.length-1;i<n;i++){const f=(i-(actual.length-1))/Math.max(1,n-actual.length);fcs.push([i,lastA+(fc-lastA)*f])}
  const plan=months.map((_,i)=>budgetOf(p)/1000*Math.pow((i+1)/n,1.05)*(p.baseline/budgetOf(p))+(i>=Math.floor(n*.35)?p.approved/1000*((i+1-Math.floor(n*.35))/(n-Math.floor(n*.35))):0));
  const max=Math.max(bud,fc)*1.1,step=max>300?100:50;
  const x=i=>pl+i*(W-pl-pr)/(n-1),y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';for(let v=0;v<=max;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;
  const lbl=months.map((m,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${D(m+'-01').toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</text>`).join('');
  const path=pts=>pts.map((q,i)=>(i?'L':'M')+x(q[0]).toFixed(1)+' '+y(q[1]).toFixed(1)).join(' ');
  const ap=actual.map((v,i)=>[i,v]);
  const area=path(ap)+` L${x(ap.length-1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  const over=fc>bud;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de consommation et forecast en k€">
   <g class="grid">${g}</g>${lbl}
   <text x="${pl-8}" y="${pt-5}" text-anchor="end">k€</text>
   <line x1="${pl}" x2="${W-pr}" y1="${y(bud)}" y2="${y(bud)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 3"/>
   <text x="${pl+4}" y="${y(bud)-6}" style="fill:var(--ink)">Budget révisé ${Math.round(bud)} k€</text>
   <path d="${path(plan.map((v,i)=>[i,v]))}" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="5 4"/>
   <path d="${area}" fill="var(--accent)" opacity=".12"/>
   <path d="${path(ap)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
   <path d="${path(fcs)}" fill="none" stroke="${over?'var(--crit)':'var(--ok)'}" stroke-width="2.5" stroke-dasharray="6 4"/>
   <circle cx="${x(ap.length-1)}" cy="${y(lastA)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
   <circle cx="${x(n-1)}" cy="${y(fc)}" r="5" fill="${over?'var(--crit)':'var(--ok)'}" stroke="var(--surface)" stroke-width="2"/>
   <text x="${x(n-1)-8}" y="${y(fc)-10}" text-anchor="end" style="fill:${over?'var(--crit)':'var(--ok)'};font-weight:600">Forecast ${Math.round(fc)} k€</text>
  </svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>Réel consommé</span><span><i style="background:${over?'var(--crit)':'var(--ok)'}"></i>Forecast (réel + reste à faire)</span><span><i style="background:var(--faint)"></i>Baseline + changements approuvés</span></div>`;
}

const tbadge=r=>{if(!r.thread)return '';const [pid,...it]=r.thread.split('|'),n=planCount(pid,it.join('|'));return `<button class="cbadge ${n?'has':''}" data-plan-thread="${r.thread}" title="Discussion" aria-label="Discussion sur ${esc(r.label)}">${ic('msg',12)}${n?' '+n:''}</button>`};
function gantt(rows,from,to){
  const f=D(from),t=D(to),total=(t-f)/864e5,pos=d=>Math.max(0,Math.min(100,(D(d)-f)/864e5/total*100));
  const months=[];let c=new Date(f.getFullYear(),f.getMonth(),1);
  while(c<t){const s=c<f?f:c,nx=new Date(c.getFullYear(),c.getMonth()+1,1),e=nx>t?t:nx;months.push(`<span style="left:${(s-f)/864e5/total*100}%;width:${(e-s)/864e5/total*100}%">${c.toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}${c.getMonth()===0||months.length===0?' '+String(c.getFullYear()).slice(2):''}</span>`);c=nx}
  const xf=(TODAY-f)/864e5/total;
  return `<div class="gantt-wrap"><div class="gantt"><div class="g-head"><div class="g-label">Élément</div><div class="g-track">${months.join('')}</div></div>
  ${rows.map(r=>{

function risksBody(list){
  const grid=[];for(let i=5;i>=1;i--){grid.push(`<span class="ax">${i}</span>`);for(let pr=1;pr<=5;pr++){const v=i*pr,t=v>=15?'crit':v>=8?'warn':'ok';const rs=list.filter(r=>r.imp===i&&r.prob===pr);grid.push(`<div class="mc" style="background:var(--${t}-soft)">${rs.map(r=>`<button title="${esc(r.title)}">${r.id}</button>`).join('')}</div>`)}}
  grid.push('<span></span>');for(let pr=1;pr<=5;pr++)grid.push(`<span class="ax">${pr}</span>`);
  return `<div class="grid g-main">${card('Registre des risques',`<div class="list">${list.sort((a,b)=>crit(b)-crit(a)).map(r=>`<div class="li" style="align-items:flex-start"><span class="pill ${crit(r)>=15?'crit':crit(r)>=8?'warn':'ok'} nodot mono">${crit(r)}</span><div class="grow"><b><span class="mono muted" style="font-weight:500">${r.id}</span> ${esc(r.title)}</b><small style="white-space:normal">Mitigation : ${esc(r.mit)}</small><small>${P(r.p).code} · ${PEOPLE[r.owner].name} · cible ${dd(r.due)} · ${r.status}</small></div></div>`).join('')}</div>`)}${card('Matrice probabilité × impact',`<div class="matrix">${grid.join('')}</div><div style="display:flex;justify-content:space-between;margin-top:8px" class="muted"><small>↑ Impact</small><small>Probabilité →</small></div><p class="muted" style="font-size:12px;margin:8px 0 0">Criticité = probabilité × impact. Critique à partir de 15.</p>`)}</div>`;
}
PAGES.risks=()=>{const list=RISKS.filter(r=>inScope(r.p)&&(role().internal||r.client));return `<div class="page">${pageHead('Risques',`${list.length} risques ouverts · ${list.filter(r=>crit(r)>=15).length} critiques.`,can('risk.create')?`<button class="btn primary" data-modal="risk">${ic('plus',16)} Nouveau risque</button>`:'')}${risksBody(list)}${role().internal?card('Incidents & problèmes',issuesList(ISSUES.filter(i=>inScope(i.p)))):''}</div>`};
function docList(list){return list.length?`<div class="list">${list.map(d=>`<div class="li"><span class="ext" style="background:${EXTC[d.ext]||'#5B6576'}">${d.ext.toUpperCase()}</span><div class="grow"><b>${esc(d.name)}</b><small>${esc(d.entity)} · v${d.v} · ${d.size<1?Math.round(d.size*1000)+' Ko':d.size.toFixed(1)+' Mo'} · ${PEOPLE[d.by]?PEOPLE[d.by].name:d.by} · ${dd(d.at)}</small></div><span class="pill ${d.status==='Analysé'?'ok':'info'}">${d.status==='Analysé'?'Scan OK':d.status}</span><button class="btn sm" data-doc="${d.id}">Ouvrir</button></div>`).join('')}</div>`:'<div class="empty">Aucun document.</div>'}
function docsBody(list,pid,title='Documents'){
  return `<div class="grid g-main">${card(title,docList(list),'',`${list.length} fichiers · métadonnées en SQL, binaires en stockage objet`)}${can('document.create')?card('Importer',`<div class="drop-zone" id="dropZone">${ic('upload',26)}<p style="margin:8px 0 4px;color:var(--ink)"><b>Déposez un fichier</b> ou <label class="lnk" style="cursor:pointer">parcourez<input type="file" id="fileIn" hidden></label></p><small>PDF, DOCX, XLSX, CSV, PPTX, TXT, PNG, JPG · 25 Mo max</small></div><div class="notice" style="margin-top:12px;flex-direction:column;align-items:flex-start">${['Contrôle MIME et extension','Checksum SHA-256 calculé','Scan antivirus puis versioning','URL de téléchargement temporaire (15 min)'].map(s=>`<span>${ic('shield',13)} ${s}</span>`).join('')}</div><input type="hidden" id="docProj" value="${pid||''}">`):''}</div>`;
}
PAGES.documents=()=>{const list=DOCS.filter(d=>inScope(d.p)&&(role().internal||d.client));return `<div class="page">${pageHead('Documents','Documents rattachés aux clients, projets, phases, actions, risques, tests et change requests.')}${docsBody(list,null)}</div>`};
PAGES.reporting=()=>{
  const reps=[['Avancement projet','Santé, jalons, actions en retard',true],['Budget & forecast','Baseline, CR, réel, forecast, causes',role().money],['Charge & ressources','Capacité, charge, surcharges',can('resource.read')],['Risques','Registre et matrice',true],['Actions','Statuts, retards, blocages',true],['Qualité','Campagnes, taux de réussite, anomalies',true],['Portefeuille client','Vue consolidée par client',role().money],['Portefeuille manager','Projets nécessitant attention',['manager','direction','admin'].includes(me().role)],['Reporting commercial','Contrats, CA, avenants, marge',role().margin]];
  const ps=visibleProjects(),kd=upcomingKeyDates(ps,45);
  const kdCard=card('Calendrier des dates clés · 45 jours',kd.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Échéance</th><th>Date clé</th><th>Projet</th><th>Chef de projet</th><th>Tech Lead</th></tr></thead><tbody>${kd.map(x=>`<tr class="click" data-go="project" data-arg="${x.p.id}"><td style="white-space:nowrap"><span class="pill ${x.n<=3?'crit':x.n<=7?'warn':'info'} nodot mono">J-${x.n}</span> <span class="mono muted" style="font-size:12px">${dd(x.date)}</span></td><td><b>${esc(x.label)}</b></td><td>${esc(x.p.name)}</td><td>${PEOPLE[x.p.pm].name}</td><td>${PEOPLE[x.p.tl].name}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucune date clé.</div>','',`Envoyé chaque lundi aux chefs de projet, Tech Leads et consultants concernés`);
  const engCard=role().internal?card('Engagement en jours & hypercare',`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Projet</th><th class="r">Vendus</th><th class="r">Consommés</th><th class="r">Reste</th><th class="r">Forecast</th><th class="r">Écart</th><th>État</th><th>Hypercare</th></tr></thead><tbody>${ps.map(p=>{const dj=Math.round(p.hDone/H_PER_DAY),rj=Math.round(p.hRaf/H_PER_DAY),ov=dj+rj-p.days;return `<tr class="click" data-go="project" data-arg="${p.id}"><td class="cell-main"><b>${esc(p.name)}</b><small>${CLIENTS[p.client].name}</small></td><td class="r mono">${p.days} j</td><td class="r mono">${dj} j</td><td class="r mono">${rj} j</td><td class="r mono"><b>${dj+rj} j</b></td><td class="r mono ${ov>0?'t-crit':'t-ok'}">${ov>0?'+':''}${ov} j</td><td>${stagePill(p)}</td><td>${p.hyper.on?`<span class="pill info nodot">${p.hyper.weeks} sem. · ${dd(p.hyper.start)}</span>`:'<span class="pill nodot">Non</span>'}</td></tr>`}).join('')}</tbody></table></div>`):'';
  return `<div class="page">${pageHead('Reporting','Chaque rapport respecte vos permissions : les colonnes financières disparaissent si vous n\'y avez pas droit.')}${kdCard}${engCard}<div class="grid g3">${reps.map(r=>`<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px;${r[2]?'':'opacity:.55'}"><div style="display:flex;gap:10px;align-items:center"><span class="t-info">${ic(r[2]?'chart':'lock',20)}</span><h3 style="font:600 16px var(--f-display)">${r[0]}</h3></div><p class="muted" style="margin:0;font-size:13px">${r[1]}</p><div class="btns" style="margin-top:auto">${r[2]?`<button class="btn sm" data-export="csv" data-rep="${r[0]}">CSV</button><button class="btn sm" data-export="xlsx" data-rep="${r[0]}">Excel</button><button class="btn sm" data-export="pdf" data-rep="${r[0]}">PDF</button>`:'<span class="tag">Permission requise</span>'}</div></div>`).join('')}</div></div>`;
};

  if(st==='lifecycle'){const used=k=>PROJECTS.some(p=>p.lc.some(e=>e.k===k)),cnt=k=>PROJECTS.filter(p=>stateOf(p).cur.k===k).length,dis=canEdit?'':'disabled';

   body=`<div class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:16px">

    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ordre</th><th>Libellé</th><th>Type</th><th>Couleur</th><th>Critère d'entrée</th><th class="r">Projets</th><th></th></tr></thead><tbody>${LC.map((x,i)=>`<tr><td style="white-space:nowrap"><button class="btn sm ghost" data-lc-move="${i}|-1" ${i===0||!canEdit?'disabled':''} aria-label="Monter">↑</button><button class="btn sm ghost" data-lc-move="${i}|1" ${i===LC.length-1||!canEdit?'disabled':''} aria-label="Descendre">↓</button></td>
